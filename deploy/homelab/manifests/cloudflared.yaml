# Cloudflare Tunnel connector. It keeps an outbound connection to Cloudflare, so nothing has to be open on the router.
# The tunnel is "remotely managed": its token is the Secret cloudflared-token (key: token), and its public hostnames
# (snake, snake-api, snake-game -> the Services below) are set in the Cloudflare dashboard. See README.md.
# ${TUNNEL_IMAGE} is filled in by deploy.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: home-apps
  labels:
    app: cloudflared
    app.kubernetes.io/part-of: snake-game
spec:
  # Two connectors for one tunnel: a restart or a lost node never takes the site down.
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
        app.kubernetes.io/part-of: snake-game
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: ${TUNNEL_IMAGE}
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: metrics
              containerPort: 2000
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 128Mi
