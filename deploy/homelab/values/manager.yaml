# Manager api: join and room endpoints, the manager hub, the room registry and the admin api.
# Set by deploy.sh: image, ingress.host.
imagePullSecrets:
  - name: cr-homel4b

ingress:
  enabled: true
  host: ""

resources:
  cpuRequests: "50m"
  memoryRequests: "128Mi"
  memoryLimit: "512Mi"

# Keeps the gameplay config an administrator saved (perks and prize) across restarts of the manager.
persistence:
  enabled: true
  size: 100Mi
  mountPath: /data

env:
  GameplayConfiguration__StorePath: "/data/gameplay.json"
  AccountsConfiguration__StorePath: "/data/accounts.json"
  AccountsConfiguration__StatsPath: "/data/stats.json"
  # The database user the manager runs as cannot change tables, so the migrations are applied by hand (docs/DATABASE.md), not at start.
  Database__MigrateOnStart: "false"
  ASPNETCORE_URLS: "http://+:8080"
  ASPNETCORE_ENVIRONMENT: "Production"
  Serilog__MinimumLevel: "Information"
  # Redis is wired in but nothing needs it to play (see docs/ROOMS.md); the connection is lazy and failures are ignored.
  AppSettings__RedisConfiguration__Host: "redis.infrastructure.svc.cluster.local"

secretEnv:
  AppSettings__EventbusConfiguration__ConnectionString:
    secretName: snake-secrets
    key: rabbitmq-url
  AppSettings__RedisConfiguration__Password:
    secretName: snake-secrets
    key: redis-password
  # Used by the game servers toward the manager, and by the manager toward the game servers.
  AuthConfiguration__ApiKeys__0:
    secretName: snake-secrets
    key: api-key
  # Sign in with a social account. A provider is offered only when both keys are set (see docs/ACCOUNTS.md); deploy.sh fills them from .env.
  OAuth__Providers__github__ClientId:
    secretName: snake-secrets
    key: oauth-github-id
    optional: true
  OAuth__Providers__github__ClientSecret:
    secretName: snake-secrets
    key: oauth-github-secret
    optional: true
  OAuth__Providers__discord__ClientId:
    secretName: snake-secrets
    key: oauth-discord-id
    optional: true
  OAuth__Providers__discord__ClientSecret:
    secretName: snake-secrets
    key: oauth-discord-secret
    optional: true
  OAuth__Providers__google__ClientId:
    secretName: snake-secrets
    key: oauth-google-id
    optional: true
  OAuth__Providers__google__ClientSecret:
    secretName: snake-secrets
    key: oauth-google-secret
    optional: true
  # Steam signs in with OpenID: its Web API key (steamcommunity.com/dev/apikey) only asks Steam for the player's name.
  OAuth__Providers__steam__ClientSecret:
    secretName: snake-secrets
    key: oauth-steam-secret
    optional: true
  # The Postgres database of accounts and stats (docs/DATABASE.md). Without the key the manager keeps them in its files.
  ConnectionStrings__Database:
    secretName: snake-secrets
    key: database-connection
    optional: true
  # Keys the hash of a social account's id. Made once by deploy.sh and kept: if it changed, every social account would look new.
  AccountsConfiguration__LoginPepper:
    secretName: snake-secrets
    key: login-pepper
  # Opens the admin api and the /admin page. Without it the admin api is closed to everyone.
  AuthConfiguration__AdminApiKeys__0:
    secretName: snake-secrets
    key: admin-key
