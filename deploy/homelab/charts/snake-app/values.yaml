# Defaults for one workload. Each workload overrides them in deploy/homelab/values/<workload>.yaml.

replicaCount: 1

# The release being deployed, shown as a label on the Deployment. Not on the pods: a new number alone restarts nothing.
appVersion: ""

# Recreate: never two pods at once. The game server keeps its rooms in memory, so a second pod would split the players.
strategy: Recreate

image:
  repository: "" # set by deploy.sh
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

containerPort: 8080

# The numeric user of the image: the kubelet cannot check "runAsNonRoot" against a user name.
# 1654 is "app" in the .NET 8 images, 101 is nginx-unprivileged.
runAsUser: 1654

probe:
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10

env: {}

# A small volume for what the app must keep across restarts (the manager's gameplay config). One pod at a time uses it,
# which the Recreate strategy above guarantees. Off by default; a workload turns it on in its values file.
persistence:
  enabled: false
  size: 100Mi
  mountPath: /data
  # Empty: the cluster's default storage class.
  storageClass: ""

# NAME: { secretName, key }
# Annotations of the pods. deploy.sh puts a checksum of the Secret on the manager's, so a changed Secret (a key for signing in with a
# social account, say) starts a new pod: a pod only reads its Secret when it starts.
podAnnotations: {}

secretEnv: {}

resources:
  cpuRequests: "50m"
  memoryRequests: "128Mi"
  memoryLimit: "512Mi"

service:
  port: 8080

# Routed by the external Traefik. With a clusterIssuer, cert-manager issues the certificate of the host into the
# Secret <release>-tls (a DNS-01 issuer works for hosts that are not reachable for HTTP-01).
ingress:
  enabled: true
  className: traefik-external
  host: ""
  clusterIssuer: letsencrypt-production-andradev-io-issuer
