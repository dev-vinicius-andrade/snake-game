# One public host serves everything, so the browser needs no CORS and the tunnel needs a single hostname:
#   /       the site (static files below)
#   /api/   the manager api, its hub (/api/manager) and the admin api (/api/admin), with the /api prefix removed
#   /game   the game server hub (negotiate and websocket), passed on as it is
# The services are found by name in the cluster (namespace home-apps, see deploy/homelab/deploy.sh). The name is looked up
# on each request, so this pod starts even when the manager or the game server is not up yet.

# Websocket upgrade when the browser asks for one, a normal connection otherwise.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

# The access log, one JSON line per request on stdout, for the Grafana dashboard (deploy/homelab/grafana). Every request reaches this
# pod through the Cloudflare tunnel, so the address nginx sees is the tunnel's: the visitor is the one Cloudflare passes on.
map $http_cf_connecting_ip $snake_client_ip {
  default $http_cf_connecting_ip;
  ""      $remote_addr;
}

# What was asked for, without the query string (it can carry an oauth code) and without the room code of a join link.
map $request_uri $snake_path {
  ~^/join/                 /join/:code;
  ~^(?<without_query>[^?]*) $without_query;
}

# The cluster's own health checks are not visits.
map $http_user_agent $snake_loggable {
  ~^kube-probe 0;
  default      1;
}

log_format snake escape=json
  '{"time":"$time_iso8601","ip":"$snake_client_ip","country":"$http_cf_ipcountry","method":"$request_method","host":"$host",'
  '"path":"$snake_path","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,"ctype":"$sent_http_content_type",'
  '"ref":"$http_referer","ua":"$http_user_agent"}';

server {
  listen 8080;
  access_log /dev/stdout snake if=$snake_loggable;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

  # Hashed build files never change.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location /api/ {
    set $manager http://snake-manager.home-apps.svc.cluster.local:8080;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $manager;
    include /etc/nginx/conf.d/proxy_common.inc;
  }

  location ~ ^/game(/|$) {
    set $game http://snake-game.home-apps.svc.cluster.local:8080;
    proxy_pass $game;
    include /etc/nginx/conf.d/proxy_common.inc;
  }

  # Single page app: /join/ABC234, /admin and the game route are answered by index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
