# One public host serves everything, so the browser needs no CORS and the tunnel needs a single hostname:
#   /       the site (static files below)
#   /api/   the manager api, its hub (/api/manager) and the admin api (/api/admin), with the /api prefix removed
#   /game   the game server hub (negotiate and websocket), passed on as it is
# The services are found by name in the cluster (namespace home-apps, see deploy/homelab/deploy.sh). The name is looked up
# on each request, so this pod starts even when the manager or the game server is not up yet.

# Websocket upgrade when the browser asks for one, a normal connection otherwise.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

  # Hashed build files never change.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location /api/ {
    set $manager http://snake-manager.home-apps.svc.cluster.local:8080;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $manager;
    include /etc/nginx/conf.d/proxy_common.inc;
  }

  location ~ ^/game(/|$) {
    set $game http://snake-game.home-apps.svc.cluster.local:8080;
    proxy_pass $game;
    include /etc/nginx/conf.d/proxy_common.inc;
  }

  # Single page app: /join/ABC234, /admin and the game route are answered by index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
