<div>
  <div class="flex flex-col text-balance">
    <span
      >Now you'll calibrate the eye tracking, so that the software can use the
      image of your eyes to predict where you are looking.</span
    >
    <span
      >You'll see a series of dots appear on the screen. Look at each dot and
      click on it.</span
    >
  </div>
  <div class="w-full flex justify-center mt-5">
    <div>
      <p-button
        label="Got it!"
        (onClick)="onOkClicked()"
        [outlined]="true"
        styleClass="p-5 rounded-md p-5 w-96"
      ></p-button>
    </div>
  </div>
</div>
