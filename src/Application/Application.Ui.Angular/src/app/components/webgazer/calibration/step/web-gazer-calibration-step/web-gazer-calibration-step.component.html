<app-webgazer
  [showVideo]="false"
  (onInitialized)="onWebgazerInitialized($event)"
/>
@if (finished) {
<div class="flex flex-col justify-center items-center h-screen">
  <div class="flex justify-center mt-5 w-full">
    <ul class="list-none space-y-1">
      <li>Calibration finished</li>
      <li>Click on the button below to continue</li>
    </ul>
  </div>
  <div class="w-full flex justify-center mt-5">
    <p-button
      label="Got it!"
      (onClick)="onOkClicked()"
      [outlined]="true"
      styleClass="p-5 rounded-md w-96"
    ></p-button>
  </div>
</div>
} @else {
<div class="fixed top-0 left-0 bg-app-background w-screen h-screen border">
  <button
    class="absolute flex bg-blue-500 hover:bg-blue-700 rounded-full exploding-button"
    (click)="onCurrentPointButtonClicked($event)"
    [style.left.px]="leftPosition"
    [style.top.px]="topPosition"
    [style.width.px]="pointSize"
    [style.height.px]="pointSize"
  ></button>
</div>
}
